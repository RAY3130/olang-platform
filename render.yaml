services:
  - type: web
    name: olang-platform
    runtime: node
    plan: starter
    region: singapore
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SITE_MODE
        value: production
      - key: ALLOW_SEARCH_INDEXING
        value: "1"
      - key: DB_PATH
        value: /var/data/olang.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: ADMIN_INITIAL_USERNAME
        value: admin
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: EMAIL_TRANSPORT
        value: outbox
    disk:
      name: olang-data
      mountPath: /var/data
      sizeGB: 1
