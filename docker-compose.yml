services:
  olang:
    build: .
    restart: unless-stopped
    ports:
      - "4174:4174"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4174
      DB_PATH: /app/storage/olang.sqlite
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - olang_storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  olang_storage:
